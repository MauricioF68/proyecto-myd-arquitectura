# Identificación del proyecto en SonarQube
sonar.projectKey=myd-controles-backend
sonar.projectName=MyD Controles API
sonar.projectVersion=1.0

# Dónde está el código fuente
sonar.sources=backend

# Qué carpetas ignorar (código de terceros o pruebas)
sonar.exclusions=backend/vendor/**, backend/storage/**, backend/bootstrap/**, backend/public/**

# Configuración de pruebas unitarias (PHPUnit)
sonar.php.tests.reportPath=backend/tests/report.xml
sonar.php.coverage.reportPaths=backend/tests/coverage.xml

# Codificación
sonar.sourceEncoding=UTF-8