---
- name: Configurar Servidor de CI/CD (Jenkins Agent)
  hosts: all
  become: yes  # Ejecutar como administrador (sudo)
  
  tasks:
    # 1. Actualizar el sistema
    - name: Actualizar caché de paquetes (apt)
      apt:
        update_cache: yes

    # 2. Instalar dependencias básicas
    - name: Instalar herramientas básicas (curl, unzip, python, pip)
      apt:
        name:
          - curl
          - unzip
          - python3
          - python3-pip
          - software-properties-common
        state: present

    # 3. Instalar AWS CLI (Para hablar con la nube)
    - name: Descargar instalador de AWS CLI
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: "/tmp/awscliv2.zip"

    - name: Descomprimir AWS CLI
      unarchive:
        src: "/tmp/awscliv2.zip"
        dest: "/tmp"
        remote_src: yes

    - name: Ejecutar instalador de AWS CLI
      command: /tmp/aws/install --update

    # 4. Instalar Terraform (Para crear la infraestructura)
    - name: Agregar llave GPG de HashiCorp
      apt_key:
        url: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Agregar repositorio de HashiCorp
      apt_repository:
        repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present

    - name: Instalar Terraform
      apt:
        name: terraform
        state: present

    # 5. Instalar Docker (Para crear los contenedores)
    - name: Instalar Docker.io
      apt:
        name: docker.io
        state: present

    - name: Iniciar y habilitar servicio Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Dar permisos al usuario para usar Docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # 6. Instalar Checkov (Para seguridad - Requisito docente)
    - name: Instalar Checkov con PIP
      pip:
        name: checkov
        executable: pip3

    # 7. Mensaje final
    - name: Verificar instalaciones
      debug:
        msg: "¡Servidor configurado con Docker, Terraform, AWS CLI y Checkov!"