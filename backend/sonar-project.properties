# Archivo de Propiedades de SonarQube para tu proyecto Laravel

# 1. Identificación del Proyecto
sonar.projectKey=MYD-LARAVEL-PROJECT
sonar.projectName=MyD Cotizaciones Laravel Monolito

# 2. Rutas de Código Fuente (Relativo a /usr/src, donde se monta la carpeta backend)
# Laravel típicamente usa app/, routes/, config/ y database/
sonar.sources=app,config,routes,database

# 3. Codificación de Archivos
sonar.sourceEncoding=UTF-8

# 4. Exclusiones Importantes (No escanear dependencias ni archivos generados)
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,public/**,node_modules/**,tests/**