# Archivo: backend/sonar-project.properties

# 1. Identificación del Proyecto
sonar.projectKey=MYD-LARAVEL-PROJECT
sonar.projectName=MyD Cotizaciones Laravel Monolito

# 2. Rutas de Código Fuente (sources)
# Indica las carpetas con código Laravel que deben ser analizadas.
sonar.sources=app,config,routes,database

# 3. Exclusiones Importantes
# Ignora las carpetas generadas y las dependencias para análisis limpios.
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,public/**,node_modules/**,tests/**

# 4. Codificación
sonar.sourceEncoding=UTF-8